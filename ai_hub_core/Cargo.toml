[package]
name = "ai_hub_core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros"] }
onnxruntime = { version = "0.0.14", features = ["model-fetching"] }
tokenizers = "0.15"
anyhow = "1.0"
windows = { version = "0.48", features = ["Win32_Security_Cryptography"] }
base64 = "0.21"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
zip = "0.6"
sha2 = "0.10"
hex = "0.4"
