name: Windows App Compiler Pipeline

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  compile_binaries:
    name: Build Native Windows Binaries
    runs-on: windows-latest
    permissions:
      contents: write # Crucial permission flag allowing the action to create release markers

    steps:
    - name: Checkout Code Repository Trace Lines
      uses: actions/checkout@v4

    - name: Initialize Rust Toolchain Cache
      uses: dtolnay/rust-toolchain@stable

    - name: Populate Dependency Caches
      uses: Swatinem/rust-cache@v2

    - name: Run Release Compilation Pipeline
      run: cargo build --release --verbose

    - name: Generate Unique Timestamp Release Tag
      id: tag
      run: echo "release_tag=v1.0.$(Get-Date -Format 'yyyyMMdd.HHmmss')" >> $env:GITHUB_OUTPUT
      shell: powershell

    - name: Package Executable into Distributed Download Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: AI Hub Desktop Engine Build ${{ steps.tag.outputs.release_tag }}
        draft: false
        prerelease: false
        files: target/release/ai_hub_app.exe
